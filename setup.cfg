[metadata]
name=chemistry_helpers

[options]
package_dir=
	=src
packages=find:
install_requires =
    numpy>=1.20

[options.extras_require]
# babel.py reads the shared server settings inside a try block (function level)
settings =
    atb_server_settings @ git+https://github.com/ATB-UQ/atb_server_settings.git@main

[options.packages.find]
where=src
